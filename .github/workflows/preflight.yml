# Shared no-VM gate for every sibling repo. Each sibling calls this with
#   uses: naimor-oss/dev-commons/.github/workflows/preflight.yml@main
# It rebuilds the Debian-SAMBA/ sibling layout, runs bin/preflight.sh with
# tools required, then the AD DC console-dialog harness in a real PTY.
#
# Cross-repo changes: when a sibling has a branch with the same name as the
# branch under test, that branch is used, so producer and consumer changes
# validate together before either merges. Otherwise siblings use main.
name: preflight

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LC_ALL: C.UTF-8
  SIBLINGS: >-
    dev-commons appliance-core lab-kit lab-router
    samba-addc-appliance smb-proxy-appliance smbproxy-session-vfs

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository under test
        uses: actions/checkout@v4
        with:
          path: ws/${{ github.event.repository.name }}

      - name: Check out the other siblings
        env:
          UNDER_TEST: ${{ github.event.repository.name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          cd ws
          for repo in $SIBLINGS; do
            [[ "$repo" == "$UNDER_TEST" ]] && continue
            url="https://github.com/$OWNER/$repo.git"
            ref=main
            if [[ -n "$BRANCH" && "$BRANCH" != main ]] \
                && git ls-remote --exit-code --heads "$url" "$BRANCH" >/dev/null 2>&1; then
              ref="$BRANCH"
            fi
            echo "$repo @ $ref"
            git clone --quiet --depth 1 --branch "$ref" "$url" "$repo"
          done

      - name: Install test tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            bats shellcheck whiptail dialog tmux openssh-client xorriso >/dev/null
          bats --version
          shellcheck --version | head -2

      - name: Preflight (strict)
        env:
          PREFLIGHT_REQUIRE_TOOLS: "1"
        run: bash ws/dev-commons/bin/preflight.sh

      - name: AD DC console dialog harness (real PTY)
        run: bash ws/samba-addc-appliance/tests/run-tui-inputbox-harness.sh

      # tests/root/*.sh drive real system paths (/etc/samba, /var/lib/...) as
      # root, so each runs in its own disposable Debian 13 container and
      # refuses to start without DISPOSABLE_ROOT_TEST=1.
      # The image is pulled once, from the first registry that serves it:
      # anonymous pulls from shared runners hit each registry's limit in turn
      # (Docker Hub's toomanyrequests, then ECR Public's "Data limit
      # exceeded"), and one refusal shouldn't fail a test that never ran.
      - name: Root integration tests (disposable Debian 13 containers)
        run: |
          set -euo pipefail
          shopt -s nullglob
          suites=(ws/*/tests/root/*.sh)
          if ((${#suites[@]} == 0)); then
            echo "root integration suites run: 0"
            exit 0
          fi
          image=
          for src in mirror.gcr.io/library/debian:trixie \
                     public.ecr.aws/docker/library/debian:trixie \
                     docker.io/library/debian:trixie; do
            for try in 1 2; do
              if docker pull --quiet "$src"; then image=$src; break 2; fi
              echo "pull $src failed (try $try)"
              sleep $((try * 20))
            done
          done
          if [[ -z $image ]]; then
            echo "::error::No registry served debian:trixie (rate limits); no root suite ran"
            exit 1
          fi
          echo "image: $image"
          ran=0
          # The whole workspace is mounted read-only so a suite can use its
          # siblings (e.g. ../appliance-core/lib/kvstate.sh).
          for t in "${suites[@]}"; do
            echo "::group::$t"
            docker run --rm --pull never -v "$PWD/ws:/ws:ro" -e DISPOSABLE_ROOT_TEST=1 \
              "$image" bash "/$t"
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          echo "root integration suites run: $ran"
